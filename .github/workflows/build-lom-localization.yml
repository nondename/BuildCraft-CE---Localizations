name: Build LoM BCCE Localization

on:
  push:
    branches:
      - ru-ru-rework
    paths:
      - '.github/workflows/build-lom-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ru-ru-rework

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build and validate all localization targets
        run: ./gradlew clean build --stacktrace

      - name: List 1.20.1 artifacts
        run: ls -lah versions/1.20.1-forge/build/libs/

      - name: Upload 1.20.1 Forge localization JAR
        uses: actions/upload-artifact@v4
        with:
          name: bcce-localizations-1.20.1-forge
          path: versions/1.20.1-forge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
