name: Apply Russian localization rework

on:
  push:
    branches:
      - ru-ru-rework
    paths:
      - tools/rework_ru_ru.py
      - tools/rework_ru_ru_items.py
      - tools/fix_ru_guide_accuracy.py
      - .github/workflows/apply-ru-rework.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ru-ru-rework

      - name: Apply reviewed translations
        run: |
          python3 tools/rework_ru_ru.py
          python3 tools/rework_ru_ru_items.py
          python3 tools/fix_ru_guide_accuracy.py

      - name: Validate JSON
        run: |
          python3 -m json.tool src/main/resources/assets/buildcraft/lang/ru_ru.json >/dev/null
          python3 -m json.tool src/main/resources/assets/buildcraft/guide/text/ru_ru.json >/dev/null

      - name: Validate repository localization rules
        run: bash gradlew check

      - name: Validate diff
        run: git diff --check

      - name: Commit generated localization
        shell: bash
        run: |
          if git diff --quiet -- src/main/resources/assets/buildcraft/lang/ru_ru.json src/main/resources/assets/buildcraft/guide/text/ru_ru.json; then
            echo "No localization changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/buildcraft/lang/ru_ru.json src/main/resources/assets/buildcraft/guide/text/ru_ru.json
          git commit -m "Improve Russian localization and guide"
          git push origin HEAD:ru-ru-rework
