name: Finalize Russian localization

on:
  push:
    branches:
      - ru-ru-rework
    paths:
      - 'tools/finalize_ru_localization.py'
      - '.github/workflows/finalize-ru-localization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ru-ru-rework
          fetch-depth: 0

      - name: Apply final QA fixes
        run: python3 tools/finalize_ru_localization.py

      - name: Validate JSON
        run: |
          python3 -m json.tool src/main/resources/assets/buildcraft/lang/ru_ru.json >/dev/null
          python3 -m json.tool src/main/resources/assets/buildcraft/guide/text/ru_ru.json >/dev/null

      - name: Show final diff
        run: |
          git diff --check
          git diff -- src/main/resources/assets/buildcraft/lang/ru_ru.json src/main/resources/assets/buildcraft/guide/text/ru_ru.json

      - name: Remove one-time QA files
        run: |
          rm -f tools/finalize_ru_localization.py
          rm -f .github/workflows/finalize-ru-localization.yml

      - name: Commit finalized localization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize Russian localization QA [skip ci]"
          git push origin HEAD:ru-ru-rework
